server:
  port: ${SERVER_PORT:5273}
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecom_001_walking_skeleton}
    username: ${POSTGRES_USER:commerce}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
commerce:
  vat-rate: ${VAT_RATE:0.20}
